 "text": "Charles Lindbergh, the first person to make a solo flight across the Atlantic Ocean, took <b>33.5 hours</b> to complete the trip. If he had gone <b>26 miles per hour faster</b>, the flight would have taken <b>27 hours</b>. Find out how far the flight was. Let <b>x</b> represent Lindbergh's actual speed.",

     "why": "The faster trip gets the <b>shorter</b> time. Going faster means 27 hours, not 33.5."

    {
     "html": tbl([["Actual", "x", "33.5", "33.5x"], ["Faster", "x + 26", "27", "27(x + 26)"]]),

   ],
